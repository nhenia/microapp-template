name: Publish micro-app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare installation details and test
        run: |
          node scripts/prepare.cjs
          node tests/app.test.cjs
          node apps/the-usual/scripts/prepare.cjs
          node apps/the-usual/tests/app.test.cjs
          npm install --prefix "$RUNNER_TEMP/usual-tests" --no-audit --no-fund jsdom@30.1.2 fake-indexeddb@6.2.5
          USUAL_TEST_MODULES="$RUNNER_TEMP/usual-tests/node_modules" node apps/the-usual/tests/browser-simulation.cjs
      - name: Collect only public app files
        run: |
          mkdir _site
          cp index.html style.css script.js config.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png .nojekyll _site/
          mkdir _site/the-usual
          cp apps/the-usual/{index.html,style.css,core.js,script.js,config.js,sw.js,manifest.webmanifest,icon.svg,icon-192.png,icon-512.png,.nojekyll} _site/the-usual/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
