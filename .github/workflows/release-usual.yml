name: Release The Usual 0.1.0
on:
  push:
    branches: [main]
    paths: ['releases/the-usual-v0.1.0.md']
permissions:
  contents: write
concurrency:
  group: release-the-usual-v0.1.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify app
        run: |
          node scripts/prepare.cjs
          node tests/app.test.cjs
          node apps/the-usual/scripts/prepare.cjs
          node apps/the-usual/tests/app.test.cjs
          npm install --prefix "$RUNNER_TEMP/usual-tests" --no-audit --no-fund jsdom@30.1.2 fake-indexeddb@6.2.5
          USUAL_TEST_MODULES="$RUNNER_TEMP/usual-tests/node_modules" node apps/the-usual/tests/browser-simulation.cjs
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create the-usual-v0.1.0 --target "$RELEASE_SHA" --title "The Usual 0.1.0" --notes-file releases/the-usual-v0.1.0.md --prerelease
